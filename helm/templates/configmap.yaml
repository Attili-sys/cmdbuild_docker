apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-env
  labels:
    {{- include "openmaint.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Release.Name | quote }}
  APP_PORT: {{ .Values.service.targetPort | default "8080" | quote }}
  LOG_LEVEL: {{ .Values.app.log.logLevel | default "INFO" | quote }}
  # Consumed by docker-entrypoint.sh: selects which dump `cmdbuild.sh dbconfig
  # create` restores when the database is empty.
  CMDBUILD_DUMP: {{ .Values.app.dump | default "demo.dump.xz" | quote }}
  JAVA_OPTS: {{ .Values.app.javaOpts | default "-Xmx6000m -Xms3000m" | quote }}
